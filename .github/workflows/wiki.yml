# Copies docs/wiki into the GitHub wiki (the Wiki tab) whenever it changes on main.
# The wiki must exist first: create its first page once by hand on github.com.
name: wiki
on:
  push:
    branches: [main]
    paths: ['docs/wiki/**', '.github/workflows/wiki.yml']

permissions:
  contents: write

jobs:
  wiki:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: copy the pages into the wiki
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r docs/wiki/. wiki/
          # Wiki links have no .md ending.
          sed -i -E 's/\]\(([A-Za-z-]+)\.md\)/](\1)/g' wiki/*.md
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update from docs/wiki (${GITHUB_SHA::7})"
          git push
