# Pushing a tag like v1.0.0 builds the mod and publishes it as a GitHub release.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew build
      - name: release notes from the changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## $v" 'index($0,h)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Vertical Cut ${{ github.ref_name }} for Minecraft 26.3
          body_path: notes.md
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
