# Pushing to the release branch builds the mod and publishes it as a GitHub release,
# tagged with the version from gradle.properties.
name: release
on:
  push:
    branches: [release]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew build && rm -f build/libs/*-sources.jar
      - name: release notes from the changelog
        run: |
          v=$(grep '^version=' gradle.properties | cut -d= -f2)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          awk -v h="## $v" 'index($0,h)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Vertical Cut ${{ env.VERSION }} for Minecraft 26.3
          body_path: notes.md
          files: build/libs/*.jar
