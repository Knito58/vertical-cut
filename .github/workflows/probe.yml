name: probe
on:
  push:
    branches: [api-probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew build -q
      - name: probe
        run: |
          set +e +o pipefail
          M=$HOME/.gradle/caches/fabric-loom/26.3/minecraft-common.jar
          C=$HOME/.gradle/caches/fabric-loom/26.3/minecraft-client-only.jar
          unzip -l $M | grep -i "enderman" | grep class | grep -v '\$' | head
          cl=$(unzip -l $M | awk '{print $4}' | grep -iE '/EnderMan.class$' | head -1 | sed 's/.class$//; s#/#.#g'); javap -cp "$M" $cl | grep -iE "creepy|boolean is"
