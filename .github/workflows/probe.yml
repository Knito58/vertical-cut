name: probe
on:
  push:
    branches: [api-probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: modrinth
        run: |
          set +e +o pipefail
          for slug in metal-bundles puzzles-lib forge-config-api-port; do
            curl -sS -G "https://api.modrinth.com/v2/project/$slug/version" --data-urlencode 'loaders=["fabric"]' --data-urlencode 'game_versions=["26.3"]' | jq -r --arg s $slug '.[0] | "\($s) | \(.version_number) | \(.id) | \(.files[0].filename) | \([.dependencies[] | select(.dependency_type=="required") | .project_id] | join(","))"'
          done
          curl -sS https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o "<version>[^<]*26.3[^<]*</version>" | tail -5
          curl -sS https://maven.fabricmc.net/net/fabricmc/fabric-loader/maven-metadata.xml | grep -o "<latest>[^<]*</latest>"
