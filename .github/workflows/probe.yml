name: probe
on:
  push:
    branches: [api-probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew build -q
      - name: probe
        run: |
          set +e +o pipefail
          M=$HOME/.gradle/caches/fabric-loom/26.3/minecraft-common.jar
          C=$HOME/.gradle/caches/fabric-loom/26.3/minecraft-client-only.jar
          for cl in net.minecraft.client.Minecraft net.minecraft.client.gui.screens.Screen net.minecraft.client.KeyMapping com.mojang.blaze3d.platform.InputConstants; do
            echo "== $cl"; javap -cp "$C:$M" $cl | grep -iE "shift|TranslatedKeyMessage|isKeyDown" 
          done
          grep -rl "hasShiftDown" /dev/null
