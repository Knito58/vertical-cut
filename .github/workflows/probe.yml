name: probe
on:
  push:
    branches: [probe-adv]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew build -q
      - name: probe
        run: |
          set +e +o pipefail
          M=$HOME/.gradle/caches/fabric-loom/26.3/minecraft-common.jar
          C=$HOME/.gradle/caches/fabric-loom/26.3/minecraft-client-only.jar
          for f in story/root story/mine_stone; do unzip -p "$M" data/minecraft/advancement/$f.json; echo; done
          unzip -l "$M" | grep -i 'advancement' | grep -i background | head
          unzip -l "$C" | grep -i 'advancements/backgrounds' | head
