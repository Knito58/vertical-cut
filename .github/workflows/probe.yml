name: probe
on:
  push:
    branches: [api-probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew build -q
      - name: probe
        run: |
          set +e +o pipefail
          M=$HOME/.gradle/caches/fabric-loom/26.3/minecraft-common.jar
          C=$HOME/.gradle/caches/fabric-loom/26.3/minecraft-client-only.jar
          unzip -l $M | grep -iE "stone_crafting_materials|recipes/decorations/furnace|recipes/tools/stone_pickaxe" 
          unzip -p $M data/minecraft/advancement/recipes/decorations/furnace.json
          unzip -p $M data/minecraft/tags/item/stone_crafting_materials.json
          unzip -p $M data/minecraft/recipe/furnace.json
