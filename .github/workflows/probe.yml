name: probe
on:
  push:
    branches: [api-probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew build -q
      - name: probe
        run: |
          set +e +o pipefail
          M=$HOME/.gradle/caches/fabric-loom/26.3/minecraft-common.jar
          C=$HOME/.gradle/caches/fabric-loom/26.3/minecraft-client-only.jar
          javap -p -cp "$C:$M" net.minecraft.client.gui.screens.inventory.AbstractContainerScreen | grep -E "AbstractContainerScreen\(|imageWidth|leftPos|topPos"
          javap -p -cp "$M" net.minecraft.world.inventory.Slot | grep -E "container|Slot\("
          javap -p -cp "$M" net.minecraft.world.inventory.AbstractContainerMenu | grep -E " slots;"
