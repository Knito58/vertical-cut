name: probe
on:
  push:
    branches: [api-probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew build -q
      - name: probe
        run: |
          set +e +o pipefail
          M=$HOME/.gradle/caches/fabric-loom/26.3/minecraft-common.jar
          C=$HOME/.gradle/caches/fabric-loom/26.3/minecraft-client-only.jar
          javap -c -p -cp "$M:$C" net.minecraft.client.Options | grep -E 'ldc.*"key\.|bipush|sipush' | grep -B1 -E 'bipush|sipush' | grep -A1 'ldc' | head -120
          javap -p -cp "$M:$C" net.minecraft.sounds.SoundEvents | grep -i spyglass
