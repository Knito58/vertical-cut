name: probe
on:
  push:
    branches: [api-probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew build -q
      - name: probe
        run: |
          set +e +o pipefail
          M=$HOME/.gradle/caches/fabric-loom/26.3/minecraft-common.jar
          C=$HOME/.gradle/caches/fabric-loom/26.3/minecraft-client-only.jar
          javap -cp "$M" net.minecraft.world.entity.player.Player | grep -i "Component"
          javap -cp "$M:$C" net.minecraft.client.player.LocalPlayer | grep -i "Component"
          javap -cp "$M" net.minecraft.world.item.component.LodestoneTracker
          javap -cp "$M" net.minecraft.core.GlobalPos | grep -iE "dimension|pos\("
          javap -cp "$M:$C" com.mojang.blaze3d.platform.InputConstants | grep -E "KEY_(K|L|J|U|N|M)\b"
          javap -cp "$M:$C" net.minecraft.client.gui.Gui | grep -iE "overlay|setScreen" | head
