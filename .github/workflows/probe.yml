name: probe
on:
  push:
    branches: [api-probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: modrinth
        run: |
          set +e +o pipefail
          curl -sS -G "https://api.modrinth.com/v2/project/metal-bundles/version" --data-urlencode 'loaders=["fabric"]' --data-urlencode 'game_versions=["26.3"]' | jq -r '.[0:3][] | "\(.version_number) | \(.id) | \(.files[0].filename) | deps: \(.dependencies|tostring)"'
          curl -sS "https://api.modrinth.com/v2/project/metal-bundles" | jq -r '.description, .license.id'
          for id in $(curl -sS -G "https://api.modrinth.com/v2/project/metal-bundles/version" --data-urlencode 'loaders=["fabric"]' --data-urlencode 'game_versions=["26.3"]' | jq -r '.[0].dependencies[].project_id'); do curl -sS https://api.modrinth.com/v2/project/$id | jq -r '"dep: \(.slug) \(.title)"'; done
          url=$(curl -sS -G "https://api.modrinth.com/v2/project/metal-bundles/version" --data-urlencode 'loaders=["fabric"]' --data-urlencode 'game_versions=["26.3"]' | jq -r '.[0].files[0].url')
          curl -sSL -o mb.jar "$url" && unzip -p mb.jar fabric.mod.json; unzip -l mb.jar | grep -iE "lang/en_us|recipe" | head -20
