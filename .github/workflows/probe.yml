name: probe
on:
  push:
    branches: [api-probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew build -q
      - name: vanilla data
        run: |
          M=$HOME/.gradle/caches/fabric-loom/26.3/minecraft-common.jar
          C=$HOME/.gradle/caches/fabric-loom/26.3/minecraft-client-only.jar
          for f in data/minecraft/recipe/netherite_sword_smithing.json data/minecraft/advancement/recipes/combat/netherite_sword_smithing.json; do echo "=== $f"; unzip -p $M $f; done
          for c in net.minecraft.client.sounds.SoundManager net.minecraft.client.resources.sounds.SimpleSoundInstance; do echo "=== $c"; javap -cp "$C:$M" "$c" | head -60; done
          javap -cp "$M" net.minecraft.sounds.SoundEvents | grep -iE "BEE_LOOP|RESPAWN_ANCHOR_AMBIENT"
          javap -cp "$M" net.minecraft.world.level.block.state.BlockBehaviour\$BlockStateBase | grep -iE "getFluidState|liquid"
          javap -cp "$M" net.minecraft.world.level.material.FluidState | grep -iE " is\(|isEmpty|getType"
          javap -cp "$M" net.minecraft.tags.FluidTags | head -20
