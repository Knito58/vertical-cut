name: probe
on:
  push:
    branches: [api-probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: modrinth
        run: |
          set +e +o pipefail
          for q in "iron bundle" "bundles" "bundle" "better bundles" "backpack"; do
            echo "=== $q"
            curl -sS -G "https://api.modrinth.com/v2/search" --data-urlencode "query=$q" --data-urlencode 'facets=[["versions:26.3"],["categories:fabric"]]' --data-urlencode 'limit=12' | jq -r '.hits[] | "\(.slug) | \(.title) | \(.downloads) | \(.description)"'
          done
