name: probe
on:
  push:
    branches: [api-probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew build -q
      - name: vanilla data
        run: |
          M=$HOME/.gradle/caches/fabric-loom/26.3/minecraft-common.jar
          C=$HOME/.gradle/caches/fabric-loom/26.3/minecraft-client-only.jar
          p() { echo "=== $1"; javap -cp "$C:$M" "$1" 2>&1 | grep -v 'lambda\$' | grep -vE "^\s*$" | head -${2:-80}; }
          p net.minecraft.world.item.component.BundleContents 70
          p 'net.minecraft.world.item.component.BundleContents$Mutable' 40
          p net.minecraft.world.item.component.ItemContainerContents 50
          p net.minecraft.world.level.block.entity.FuelValues 30
          javap -cp "$M" net.minecraft.world.level.Level | grep -i fuel
          javap -cp "$M" net.minecraft.server.MinecraftServer | grep -i fuel
          javap -cp "$M" net.minecraft.world.item.Item | grep -iE "remainder|use\(|appendHover|isBarVisible|getBarWidth|getBarColor|overrideOtherStackedOnMe|overrideStackedOnOther"
          javap -cp "$M" net.minecraft.world.item.ItemStack | grep -iE "remainder"
          p net.minecraft.world.inventory.Slot 80
          javap -cp "$M" net.minecraft.world.inventory.AbstractContainerMenu | grep -iE "SLOT_SIZE|addStandardInventorySlots|addInventory|moveItemStackTo|quickMoveStack|stillValid|removed|clicked|broadcast"
          javap -cp "$M" net.minecraft.world.entity.player.Inventory | grep -iE "selected|getSelected|INVENTORY_SIZE|SLOT_OFFHAND|add\(|placeItemBackInInventory"
          javap -cp "$M" net.minecraft.world.entity.player.Player | grep -iE "openMenu|isShiftKeyDown|isCrouching"
          javap -cp "$M" net.minecraft.world.entity.Entity | grep -iE "isShiftKeyDown|isCrouching|isSecondaryUseActive"
          javap -cp "$M" net.minecraft.world.InteractionResult | grep -iE "static final"
          p net.minecraft.client.gui.screens.inventory.AbstractContainerScreen 90
          p net.minecraft.world.Container 50
          for f in $(find $HOME/.gradle/caches -name "fabric-item-api-v1*.jar" | head -1); do unzip -l $f | grep -i tooltip; done
