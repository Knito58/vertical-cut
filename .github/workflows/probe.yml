name: probe
on:
  push:
    branches: [api-probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: probe
        run: |
          set +e +o pipefail
          for c in metal-bundles/26.3.3 metal-bundles/TQYgbkWW puzzles-lib/26.3.15 puzzles-lib/68hLXNWE forge-config-api-port/26.3.1 forge-config-api-port/JpKvrr9J; do
            s=${c%/*}; v=${c#*/}
            curl -sSL -o t.jar "https://api.modrinth.com/maven/maven/modrinth/$s/$v/$s-$v.jar"
            echo "$c: $(unzip -l t.jar | grep -oE 'fabric.mod.json|neoforge.mods.toml|META-INF/mods.toml' | head -1)"
          done
