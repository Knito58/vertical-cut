name: probe
on:
  push:
    branches: [api-probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew build -q
      - name: probe
        run: |
          set +e +o pipefail
          M=$HOME/.gradle/caches/fabric-loom/26.3/minecraft-common.jar
          C=$HOME/.gradle/caches/fabric-loom/26.3/minecraft-client-only.jar
          unzip -l $C | grep -i "item/properties/conditional" | head -40
          javap -cp "$M:$C" net.minecraft.client.renderer.item.properties.conditional.ConditionalItemModelProperties
          javap -cp "$M:$C" net.minecraft.client.renderer.item.properties.conditional.ConditionalItemModelProperty
          javap -cp "$M:$C" net.minecraft.client.renderer.item.properties.conditional.IsUsingItem
          ls ~/.gradle/caches/modules-2/files-2.1/net.fabricmc.fabric-api/ | grep -i model
