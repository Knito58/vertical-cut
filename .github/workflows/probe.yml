name: probe
on:
  push:
    branches: [api-probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew build -q
      - name: probe
        run: |
          set +e +o pipefail
          M=$HOME/.gradle/caches/fabric-loom/26.3/minecraft-common.jar
          C=$HOME/.gradle/caches/fabric-loom/26.3/minecraft-client-only.jar
          javap -p -cp "$M:$C" net.minecraft.client.renderer.item.properties.conditional.ConditionalItemModelProperties
          javap -p -cp "$M:$C" net.minecraft.client.renderer.item.properties.conditional.ItemModelPropertyTest
          javap -c -p -cp "$M:$C" net.minecraft.client.renderer.item.properties.conditional.ConditionalItemModelProperties | grep -iE "invoke|putstatic|getstatic" | head -40
          for j in $(find ~/.gradle/caches/modules-2/files-2.1/net.fabricmc.fabric-api -name "*.jar" | grep -v sources); do unzip -l $j | grep -iE "ItemModelPropert|ConditionalItem|ItemModelRegistr" && echo "== $j"; done
          javap -cp "$M:$C" net.minecraft.util.ExtraCodecs\$LateBoundIdMapper | head -20
